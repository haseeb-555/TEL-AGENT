functions:
  call_agent_async:
    type: async
    module: backend.routes.agents
    args: [query, runner, app_name, session_id]
  createEvents:
    type: async
    module: backend.routes.events
    args: [request]
  extract_deadline_from_body:
    type: async
    module: backend.routes.agents
    args: [body]
    params:
      returns: dict
  get_all_user_emails:
    type: sync
    module: backend.main
  root:
    type: async
    module: backend.routes.agents
  schedule_events:
    type: sync
    module: backend.main
  start_agent_session:
    type: sync
    module: backend.routes.agents
    args: [session_id]
  to_rfc3339:
    type: sync
    module: backend.routes.events
    args: [dt_str]
    params:
      returns: str
  websocket_endpoint:
    type: async
    module: backend.routes.agents
    args: [websocket, session_id]

variables:
  GOOGLE_CLIENT_ID:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.routes.events, backend.routes.agents]
  GOOGLE_CLIENT_SECRET:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.routes.events, backend.routes.agents]
  REDIRECT_URI:
    type: env
    params:
      caller: [os.getenv]
      path: [backend.routes.events, backend.routes.agents]

files:
  index.html:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [STATIC_DIR, index.html]
  STATIC_DIR:
    type: literal
    actions: [read]
    params:
      caller: [Path(static)]

networks:
  localhost:
    type: api
    actions: [POST]
    urls: [/createEvents]
    protocols: [http]
    ports: ["8000"]
    params:
      caller: [schedule_events]
